name: Kinetic HR Cloud — Automated Azure CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Build & Verify Both Frontend & Backend
  # -------------------------------------------------------------
  build_and_verify:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Build & Verify (TypeScript & Bundles)
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      # Verify Backend Functions Build
      - name: Install Backend Dependencies
        run: npm ci
        working-directory: backend

      - name: Build Backend (TypeScript)
        run: npm run build
        working-directory: backend

      # Verify Frontend Web App Build
      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Frontend SPA
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://kinetichr-api-d0cwatbqbaafg9hh.southindia-01.azurewebsites.net/api
          VITE_APP_ENV: production

  # -------------------------------------------------------------
  # Job 2: Deploy Frontend to Azure Static Web Apps (SWA)
  # -------------------------------------------------------------
  deploy_frontend:
    needs: build_and_verify
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.action == 'closed') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Deploy to Azure Static Web Apps
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Deploy to Azure SWA
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: ${{ github.event.action == 'closed' && 'close' || 'upload' }}
          app_location: 'frontend'
          output_location: 'dist'
        env:
          VITE_API_BASE_URL: https://kinetichr-api-d0cwatbqbaafg9hh.southindia-01.azurewebsites.net/api
          VITE_APP_ENV: production

  # -------------------------------------------------------------
  # Job 3: Deploy Backend Microservices to Azure Functions
  # -------------------------------------------------------------
  deploy_backend:
    needs: build_and_verify
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Deploy to Azure Functions
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        run: npm ci
        working-directory: backend

      - name: Build Backend
        run: npm run build
        working-directory: backend

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTION_APP_NAME }}
          package: backend
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
